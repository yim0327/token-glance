<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Token Glance app icon ("Peek over bar"): two eyes glancing over a usage bar.
    Own design; no third-party marks or shapes based on them (CLAUDE.md, docs/trademarks.md).
    macOS icon grid: 1024 canvas, 824 x 824 body at (100, 100), drop shadow below the body.
    The body is a rounded square with the template's 185 px corner radius.
    Rebuild AppIcon.icns with scripts/make-app-icon.sh after changing this file.
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc4ff"/>
      <stop offset="1" stop-color="#2f6fe0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="clip"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <!-- shadow and body -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#000" opacity="0.32" transform="translate(0 12)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sky)"/>

  <g clip-path="url(#clip)">
    <!-- eyes: white, ink outline, pupils looking up and to the right, one glint each -->
    <g stroke="#14143a" stroke-width="18">
      <ellipse cx="404" cy="446" rx="118" ry="176" fill="#fff"/>
      <ellipse cx="620" cy="446" rx="118" ry="176" fill="#fff"/>
    </g>
    <g fill="#14143a">
      <ellipse cx="444" cy="420" rx="65" ry="92"/>
      <ellipse cx="660" cy="420" rx="65" ry="92"/>
    </g>
    <g fill="#fff">
      <circle cx="420" cy="381" r="20"/>
      <circle cx="636" cy="381" r="20"/>
    </g>

    <!-- usage bar in front of the eyes: track and the used share -->
    <rect x="150" y="590" width="724" height="196" rx="98" fill="#fff" stroke="#14143a" stroke-width="22"/>
    <rect x="184" y="624" width="440" height="128" rx="64" fill="#34d399"/>

    <!-- inner rim so the body edge stays visible on dark backgrounds -->
    <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="#fff" stroke-opacity="0.16" stroke-width="10"/>
  </g>
  <!-- hairline edge for light backgrounds -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="#000" stroke-opacity="0.12" stroke-width="2"/>
</svg>
